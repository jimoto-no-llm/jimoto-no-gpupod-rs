# Replace the hostname, paths, and certificate files for your Linux installation.
server {
    listen 443 ssl;
    server_name gpu.example.org;
    ssl_certificate /etc/letsencrypt/live/gpu.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gpu.example.org/privkey.pem;
    client_max_body_size 1m;
    location /static/ {
        alias /opt/gpupod/.control-state/static/;
    }
    location ~ ^/api/nodes/[0-9a-f-]+/benchmark/$ {
        client_max_body_size 64m;
        client_body_timeout 15s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 65s;
        proxy_send_timeout 15s;
        gzip off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
