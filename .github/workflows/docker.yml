name: Docker

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - scripts/docker/**
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - examples/templates.json
      - .github/workflows/docker.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - scripts/docker/**
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - examples/templates.json
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: gpupod

jobs:
  compose-config:
    name: compose 設定の検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config
        run: docker compose -f docker-compose.yml config --quiet
      - name: shellcheck（運用スクリプト）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck scripts/*.sh scripts/docker/*.sh

  image:
    name: イメージのビルド（実行はしない）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: docker build
        shell: bash
        run: |
          set -o pipefail
          docker buildx build \
            --progress=plain \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag "$IMAGE_NAME:ci" \
            --target runtime \
            . 2>&1 | tee "$RUNNER_TEMP/docker-build.log"
      - name: Docker の情報を残す
        if: failure()
        run: docker version && docker buildx version
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: docker-build-log
          path: ${{ runner.temp }}/docker-build.log
          retention-days: 7
